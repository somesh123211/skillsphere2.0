# -Djavax.net.ssl.trustStore points Gradle at a project-local copy of the
# JDK's cacerts with this machine's Avast TLS-interception root added (see
# android/truststore/, gitignored - not portable between machines). Without
# it, Gradle can't resolve any Maven dependency: Avast re-signs all outbound
# HTTPS with its own root, which the default JVM truststore doesn't trust.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError "-Djavax.net.ssl.trustStore=D:/hod app/frontend/FRONTEND/android/truststore/gradle-cacerts.jks" -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
android.enableJetifier=true
# Non-daemon builds fully release file handles on exit - a persistent
# Gradle daemon on this machine was observed holding locks into
# build/**/merged_jni_libs after a failed build, breaking every retry.
org.gradle.daemon=false
